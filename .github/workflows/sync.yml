name: Playlist Sync

# 매주 수요일 오전 9시 KST(수요일 00:00 UTC) 공개 플레이리스트 → tracks.json 동기화 → 변경 시 사이트 재빌드 & push
# 수동 실행: Actions 탭 → "Run workflow"
on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

# weekly-post.yml 등 사이트에 쓰는 다른 워크플로와 동시 실행 방지
concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # OG 이미지용 한국어 폰트
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Sync playlist
        id: sync
        run: |
          set +e
          python3 sync_playlist.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0=변경없음, 10=변경있음 → 정상 / 1=에러 → 실패
          [ "$rc" -eq 1 ] && exit 1
          exit 0

      - name: Build, prune orphans, commit & push
        if: steps.sync.outputs.rc == '10'
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'https://minsungkwon-bit.github.io' }}
        run: |
          set -e
          python3 build.py --domain "$SITE_DOMAIN"

          # tracks.json에 없는 트랙 페이지/OG 정리
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          ids = {t["videoId"] for t in json.load(open("tracks.json"))}
          removed = 0
          tdir = Path("tracks")
          if tdir.exists():
              for d in tdir.iterdir():
                  if d.is_dir() and d.name not in ids:
                      shutil.rmtree(d); removed += 1
                      og = Path("og") / f"track-{d.name}.png"
                      if og.exists(): og.unlink()
          print(f"orphan track pages removed: {removed}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "스테이징 변경 없음 - push 스킵"
            exit 0
          fi
          git commit -m "sync: playlist auto-sync ($(date -u +'%Y-%m-%dT%H:%MZ'))

          🤖 Auto-generated by 10-min Playlist Sync workflow"
          git push
